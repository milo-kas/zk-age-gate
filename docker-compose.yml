services:
  zk-env:
    build:
      context: .
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    environment:
      - CARGO_TARGET_DIR=/usr/local/cargo/target
    volumes:
      - ./:/workspace
      - cargo-cache:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-cache:/usr/local/cargo/target

volumes:
  cargo-cache:
  cargo-git:
  target-cache:
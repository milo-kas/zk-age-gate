[package]
name = "zk-age-gate"
version = "0.1.0"
edition = "2024"

[dependencies]
ark-bn254 = "0.5.0"

issuer = { workspace = true }
prover = { workspace = true }
types = { workspace = true }

[workspace]
resolver = "3"
members = [
    "crates/types",
    "crates/issuer",
    "crates/prover",
    "crates/verifier"
]

[workspace.dependencies]
types = { path = "crates/types" }
issuer = { path = "crates/issuer" }
prover = { path = "crates/prover" }
verifier = { path = "crates/verifier" }
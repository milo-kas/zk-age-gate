[package]
name = "zk-age-gate"
version = "0.1.0"
edition = "2024"

[dependencies]
types = { workspace = true }

issuer = { workspace = true }
prover = { workspace = true }
verifier = { workspace = true }

tokio = "1.53.1"
chrono = { workspace = true }
ark-bn254 = { workspace = true }
light-poseidon = { workspace = true }

# For tests
[dev-dependencies]
verifier = { workspace = true, features = ["test-utils"] }
ark-bn254 = { workspace = true }
light-poseidon = { workspace = true }
ed25519-dalek = { workspace = true }

# Fixed witnesscalc C++ filter for `.dat`. TODO: update after PR approval
[patch.crates-io]
witnesscalc-adapter = { git = "https://github.com/milo-kas/witnesscalc_adapter.git", branch = "fix-circom-cpp-filter" }

[workspace]
resolver = "3"
members = [
    "crates/types",
    "crates/issuer",
    "crates/prover",
    "crates/verifier",
]

[workspace.dependencies]
# Internal crates
types = { path = "crates/types" }
issuer = { path = "crates/issuer" }
prover = { path = "crates/prover" }
verifier = { path = "crates/verifier" }

# Cryptography (ARK / signature / hash)
ark-std = { version = "0.5.0", features = ["getrandom"] }
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
ark-groth16 = "0.5.0"
ark-snark = "0.5.0"
ark-circom = { version = "0.5.0", default-features = false }
ed25519-dalek = "3.0.0"
light-poseidon = "0.4.0"

# Circom proving (native C++ witness)
circom-prover = { version = "0.1.4", default-features = false, features = ["witnesscalc", "arkworks"] }
witnesscalc-adapter = "0.1.7"

# Age / Dates
chrono = "0.4.45"

# Utilities
colored = "3.1.1"

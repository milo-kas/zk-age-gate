[package]
name = "prover"
version = "0.1.0"
edition = "2024"

[dependencies]
types = { workspace = true }

# Enable BOTH witnesscalc and arkworks features for circom-prover
circom-prover = { version = "0.1.4", default-features = false, features = ["witnesscalc", "arkworks"] }

# Satisfy Wasmer's compile-time requirement for a native backend flag (pulled in by ark-circom)
wasmer = { version = "4.4.0", features = ["sys"] }
wasmer-wasix = { version = "0.28.0", features = ["sys"] }

# Ark
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
ark-groth16 = { workspace = true }
ark-std = { workspace = true }

witnesscalc-adapter = "0.1.7"

getrandom = { version = "0.4.3", features = ["sys_rng"] }
num-bigint = "0.4.8"
serde_json = "1.0.151"

[build-dependencies]
# Native C++ witness architecture
witnesscalc-adapter = "0.1.7"
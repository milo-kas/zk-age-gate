[package]
name = "prover"
version = "0.1.0"
edition = "2024"

[dependencies]
types = { workspace = true }

# Circom proving (native C++ witness)
circom-prover = { workspace = true }
witnesscalc-adapter = { workspace = true }

# Satisfy Wasmer's compile-time requirement for a native backend flag (pulled in by ark-circom)
wasmer = { version = "4.4.0", features = ["sys"] }
wasmer-wasix = { version = "0.28.0", features = ["sys"] }

# ARK
ark-std = { workspace = true }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
ark-groth16 = { workspace = true }

# Utilities
num-bigint = "0.4.8"
serde_json = "1.0.151"

[build-dependencies]
witnesscalc-adapter = { workspace = true }
